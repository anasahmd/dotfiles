general {
    # The command to run when the system locks
    # -f ensures it runs in the background properly
    lock_cmd = pidof hyprlock || hyprlock -f 

    # Lock before the system goes to deep sleep
    before_sleep_cmd = loginctl lock-session

    # Turn the screen back on when you touch the mouse/keyboard
    after_sleep_cmd = hyprctl dispatch dpms on
}

# -----------------------------------------------------
# STAGE 1: WARNING DIM (45 Seconds)
# -----------------------------------------------------
# Dims the screen to 10% as a visual warning that lock is coming.
# If you move the mouse now, it restores brightness instantly.
listener {
    timeout = 45                                
    on-timeout = brightnessctl -s set 10%         
    on-resume = brightnessctl -r                 
}

# -----------------------------------------------------
# STAGE 2: LOCK SCREEN (1 Minute)
# -----------------------------------------------------
# Fires the lock_cmd defined in general. 
listener {
    timeout = 60                                
    on-timeout = loginctl lock-session            
}

# -----------------------------------------------------
# STAGE 3: SCREEN OFF (1 Minute 10 Seconds)
# -----------------------------------------------------
# Turns off the display backlight completely to save maximum power.
# This happens 10 seconds after locking.
listener {
    timeout = 70                                
    on-timeout = hyprctl dispatch dpms off        
    on-resume = hyprctl dispatch dpms on          
}

# -----------------------------------------------------
# STAGE 4: DEEP SLEEP (10 Minutes)
# -----------------------------------------------------
# If you haven't returned in 10 mins, suspend to RAM.
listener {
    timeout = 600                               
    on-timeout = systemctl suspend                
}